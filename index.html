<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSG Execution System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        :root {
            --bg-color: #09090b;
            --surface: #18181b;
            --surface-hover: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
            
            /* Status Colors */
            --accent-red: #ef4444;   /* Locked / Future */
            --accent-green: #10b981; /* Active Now */
            --accent-blue: #3b82f6;  /* Up Next */
            --accent-gold: #f59e0b;  /* Deals / Points */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes activePulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes alertBannerAnim { 0% { transform: translateY(-100%); } 100% { transform: translateY(0); } }

        /* --- LIVE ALERT BANNER --- */
        #alert-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, #059669, #10b981);
            color: #ffffff;
            padding: 14px 20px;
            font-weight: 700;
            text-align: center;
            z-index: 10000;
            display: none;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            animation: alertBannerAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #alert-banner button {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 4px 12px;
            margin-left: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* --- MODALS --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 9, 11, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-box {
            background: var(--surface);
            padding: 28px 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: fadeIn 0.3s ease forwards;
        }

        .modal-box h2 { font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
        .modal-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

        .input-field {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus { border-color: var(--accent-blue); }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-primary:active { transform: scale(0.98); }
        .error-msg { color: var(--accent-red); font-size: 0.85rem; margin-top: 10px; display: none; font-weight: 600; }

        /* --- APP CONTAINER --- */
        .container {
            width: 100%;
            max-width: 720px;
            display: none; 
            flex-direction: column;
            gap: 20px;
            padding-bottom: 60px;
            animation: fadeIn 0.4s ease;
        }

        /* --- HEADER & CONTROLS --- */
        header {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 24px;
            background: linear-gradient(145deg, var(--surface), rgba(24, 24, 27, 0.4));
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clock-display { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
        .date-display { color: var(--accent-blue); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }

        .score-box {
            text-align: right;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 8px 16px;
            border-radius: 10px;
        }
        .score-box .label { font-size: 0.7rem; color: var(--accent-gold); font-weight: 700; text-transform: uppercase; }
        .score-box .value { font-size: 1.4rem; font-weight: 800; color: var(--text-main); }

        /* --- DATE NAVIGATOR & ACTION TOOLBAR --- */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .date-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .nav-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active { background: var(--surface-hover); color: var(--text-main); }

        .action-btns { display: flex; gap: 8px; }
        .sys-btn {
            background: var(--surface-hover);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sys-btn:hover { background: var(--border); }
        .sys-btn.tick-all { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: var(--accent-green); }
        .sys-btn.tick-all:hover { background: rgba(16, 185, 129, 0.3); }

        /* --- TASK LIST --- */
        .task-list { display: flex; flex-direction: column; gap: 12px; }

        .task-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .task-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: transparent; transition: all 0.25s;
        }

        /* ACTIVE NOW (GREEN) */
        .task-card.active { border-color: rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.05); }
        .task-card.active::before { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .task-card.active .time { color: var(--accent-green); }
        .task-card.active .custom-checkbox { border-color: var(--accent-green); animation: activePulse 2s infinite; }

        /* UP NEXT / RECENT PAST (BLUE / AVAILABLE) */
        .task-card.next { border-color: rgba(59, 130, 246, 0.3); }
        .task-card.next::before { background: var(--accent-blue); }
        .task-card.next .time { color: var(--accent-blue); }

        /* LOCKED FUTURE (RED / UNTICKABLE) */
        .task-card.locked { opacity: 0.6; border-color: rgba(239, 68, 68, 0.2); }
        .task-card.locked::before { background: var(--accent-red); }
        .task-card.locked .time { color: var(--accent-red); }
        .task-card.locked .checkbox-wrapper { cursor: not-allowed; }
        .task-card.locked .custom-checkbox { border-color: var(--border); background: rgba(255,255,255,0.03); opacity: 0.4; }

        /* COMPLETED STATE */
        .task-card.completed { opacity: 0.45; border-color: var(--border); background: transparent; }
        .task-card.completed::before { background: var(--text-muted); }
        .task-card.completed .title, .task-card.completed .desc { text-decoration: line-through; color: var(--text-muted); }
        .task-card.completed .time { color: var(--text-muted); }
        .task-card.completed .custom-checkbox { background: var(--text-main); border-color: var(--text-main); }
        .task-card.completed .custom-checkbox::after {
            content: ''; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
            border: solid var(--bg-color); border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .task-info { display: flex; flex-direction: column; gap: 4px; width: 82%; }
        .time { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px; }
        .title { font-size: 1rem; font-weight: 600; color: var(--text-main); }
        .desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.35; }

        .checkbox-wrapper { padding: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .custom-checkbox {
            width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--text-muted);
            position: relative; transition: all 0.2s;
        }

        /* --- DEALS TERMINAL --- */
        .deals-terminal {
            background: linear-gradient(145deg, #18181b, #27272a);
            border: 1px solid var(--border);
            padding: 20px 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .deals-terminal h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
        .deals-terminal p { font-size: 0.8rem; color: var(--text-muted); }
        
        .deals-controls { display: flex; align-items: center; gap: 16px; }
        .deal-count { font-size: 2rem; font-weight: 800; color: var(--accent-gold); font-variant-numeric: tabular-nums; }
        
        .deal-btns { display: flex; flex-direction: column; gap: 6px; }
        .btn-deal { border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
        .btn-deal:active { transform: scale(0.95); }
        .btn-deal.add { background: var(--accent-gold); color: #000; font-size: 0.85rem; }
        .btn-deal.remove { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); font-size: 0.75rem; padding: 4px 8px; }

        /* LOG VIEWER */
        #history-content { max-height: 280px; overflow-y: auto; text-align: left; margin-top: 14px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .log-entry { font-size: 0.78rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 6px 0; color: var(--text-muted); }
        .log-time { color: var(--accent-blue); font-weight: 600; margin-right: 6px; }

        @media (max-width: 600px) {
            .deals-terminal { flex-direction: column; text-align: center; gap: 14px; }
            .header-top { flex-direction: column; gap: 12px; text-align: center; }
            .score-box { text-align: center; width: 100%; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .date-nav { justify-content: center; }
            .action-btns { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- AUTO REMINDER BANNER -->
    <div id="alert-banner">
        <span id="alert-text">⏰ TIME BLOCK STARTED!</span>
        <button onclick="dismissAlert()">Dismiss</button>
    </div>

    <!-- AUTH LOCK SCREEN -->
    <div id="auth-overlay" class="overlay">
        <div class="modal-box">
            <h2>OSG SYSTEM</h2>
            <p>Enter workspace credentials</p>
            <input type="email" id="email-input" class="input-field" placeholder="Email" autocomplete="off">
            <input type="password" id="pass-input" class="input-field" placeholder="Password" onkeyup="if(event.key==='Enter') unlockApp()">
            <button class="btn-primary" onclick="unlockApp()">Initialize System</button>
            <p id="auth-error" class="error-msg">Invalid Credentials</p>
        </div>
    </div>

    <!-- HISTORY AUTH MODAL -->
    <div id="history-auth-overlay" class="overlay" style="display: none;">
        <div class="modal-box">
            <h2>SYSTEM BASE</h2>
            <p>Encrypted logs base from 24/09/2026</p>
            <input type="password" id="history-pass-input" class="input-field" placeholder="Master Protocol Password" onkeyup="if(event.key==='Enter') unlockHistory()">
            <button class="btn-primary" onclick="unlockHistory()">Access Logs</button>
            <button class="btn-primary" style="background: transparent; color: var(--text-muted); margin-top: 8px; border: 1px solid var(--border);" onclick="closeHistoryModal()">Cancel</button>
            <p id="history-error" class="error-msg">Access Denied</p>
        </div>
    </div>

    <!-- HISTORY VIEWER MODAL -->
    <div id="history-viewer-overlay" class="overlay" style="display: none;">
        <div class="modal-box" style="max-width: 480px;">
            <h2>BASE LOGS</h2>
            <p>Verified Activity Records</p>
            <div id="history-content"></div>
            <button class="btn-primary" style="margin-top: 16px;" onclick="closeHistoryModal()">Close Base</button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="container" id="app-container">
        
        <header>
            <div class="header-top">
                <div>
                    <span class="date-display" id="day-display">Loading...</span>
                    <div class="clock-display" id="live-clock">00:00:00</div>
                </div>
                <div class="score-box">
                    <div class="label">Total Points</div>
                    <div class="value" id="points-display">0</div>
                </div>
            </div>

            <div class="toolbar">
                <div class="date-nav">
                    <button class="nav-btn" onclick="changeDate(-1)">← Yesterday</button>
                    <button class="nav-btn active" id="btn-today" onclick="resetToToday()">Today</button>
                    <button class="nav-btn" onclick="changeDate(1)">Next →</button>
                </div>
                <div class="action-btns">
                    <button class="sys-btn tick-all" onclick="tickAllAvailable()">✓ Tick All</button>
                    <button class="sys-btn" onclick="enableNotifications()">🔔 Alerts</button>
                    <button class="sys-btn" onclick="openHistoryModal()">Base</button>
                </div>
            </div>
        </header>

        <!-- TASK LIST -->
        <div class="task-list" id="task-list">
            <!-- Dynamically populated -->
        </div>

        <!-- DEALS TERMINAL -->
        <div class="deals-terminal">
            <div>
                <h3>B2B Deals Closed</h3>
                <p>Track closed contracts (+500 PTS)</p>
            </div>
            <div class="deals-controls">
                <div class="deal-count" id="sales-display">0</div>
                <div class="deal-btns">
                    <button class="btn-deal add" onclick="adjustSale(1)">+ LOG DEAL</button>
                    <button class="btn-deal remove" onclick="adjustSale(-1)">Undo Entry</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- SOUND EFFECTS (WEB AUDIO API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSuccessSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;
            
            // Note 1 (E5)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(659.25, now);
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.3);

            // Note 2 (G#5)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(830.61, now + 0.1);
            gain2.gain.setValueAtTime(0.2, now + 0.1);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.4);

            // Note 3 (B5 - Fanfare Peak)
            const osc3 = audioCtx.createOscillator();
            const gain3 = audioCtx.createGain();
            osc3.type = 'sine';
            osc3.frequency.setValueAtTime(987.77, now + 0.2);
            gain3.gain.setValueAtTime(0.25, now + 0.2);
            gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
            osc3.connect(gain3);
            gain3.connect(audioCtx.destination);
            osc3.start(now + 0.2);
            osc3.stop(now + 0.7);
        }

        function playAlertChime() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now); // A5
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // --- AUTHENTICATION ---
        function unlockApp() {
            const email = document.getElementById("email-input").value.trim();
            const pass = document.getElementById("pass-input").value;
            
            if (email === "kkkkkkkk@osgweb.ge" && pass === "kkkkkkk8!") {
                document.getElementById("auth-overlay").style.display = "none";
                document.getElementById("app-container").style.display = "flex";
                initApp();
                logEvent("System initialized via primary user auth.");
            } else {
                document.getElementById("auth-error").style.display = "block";
            }
        }

        // --- SYSTEM BASE & LOGGING ---
        const MASTER_HISTORY_PASS = "TRUSTTHEPROCESS888!_+_+_+_+_+_+_+_+_++++++++++++++_++++++++";
        let systemLogs = JSON.parse(localStorage.getItem("osg_system_logs")) || [];

        function logEvent(action) {
            const now = new Date();
            const launchDate = new Date(2026, 8, 24, 0, 0, 0); // 24 Sept 2026
            if (now >= launchDate) {
                const timestamp = now.toLocaleString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
                systemLogs.push({ time: timestamp, action: action });
                localStorage.setItem("osg_system_logs", JSON.stringify(systemLogs));
            }
        }

        function openHistoryModal() {
            document.getElementById("history-auth-overlay").style.display = "flex";
            document.getElementById("history-error").style.display = "none";
            document.getElementById("history-pass-input").value = "";
        }

        function closeHistoryModal() {
            document.getElementById("history-auth-overlay").style.display = "none";
            document.getElementById("history-viewer-overlay").style.display = "none";
        }

        function unlockHistory() {
            const input = document.getElementById("history-pass-input").value;
            if (input === MASTER_HISTORY_PASS) {
                document.getElementById("history-auth-overlay").style.display = "none";
                document.getElementById("history-viewer-overlay").style.display = "flex";
                renderHistory();
            } else {
                document.getElementById("history-error").style.display = "block";
            }
        }

        function renderHistory() {
            const content = document.getElementById("history-content");
            if (systemLogs.length === 0) {
                content.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>No logs recorded yet.</p>";
                return;
            }
            content.innerHTML = systemLogs.slice().reverse().map(log => 
                `<div class="log-entry"><span class="log-time">[${log.time}]</span> ${log.action}</div>`
            ).join("");
        }

        // --- SCHEDULE TEMPLATES ---
        const weekdayTasks = [
            { id: "w1", start: "07:00", end: "07:30", title: "Wakeup & Pray", desc: "07:00 sharp: Wudu, Fajr prayer. Immediate startup." },
            { id: "w2", start: "07:30", end: "08:00", title: "Reading & Breakfast", desc: "Read 'Zebuloni' (20 mins) + high-protein breakfast." },
            { id: "w3", start: "08:00", end: "08:15", title: "Prep for School", desc: "Pack bag, head out for school." },
            { id: "w4", start: "08:15", end: "14:30", title: "School Block", desc: "Academic focus. Perform Zuhur prayer during break (~13:00)." },
            { id: "w5", start: "14:30", end: "14:45", title: "Return & Refuel", desc: "Arrive home, energizing post-school snack." },
            { id: "w6", start: "14:45", end: "15:45", title: "Physical Training", desc: "Dumbbell / Calisthenics workout session." },
            { id: "w7", start: "15:45", end: "16:00", title: "Shower & Setup", desc: "Quick cold/warm shower. Prepare workstation." },
            { id: "w8", start: "16:00", end: "16:30", title: "Lunch & Standup Call", desc: "Lunch + 15-min Daily Sync with Anri." },
            { id: "w9", start: "16:30", end: "20:00", title: "OSG AGENCY: DEEP WORK", desc: "Sales outreach, B2B audits, Meta Ads, web dev. (Asr/Maghrib breaks)." },
            { id: "w10", start: "20:10", end: "21:00", title: "School Assignments", desc: "Math, Physics, History homework." },
            { id: "w11", start: "21:00", end: "22:00", title: "Business Reading", desc: "Atomic Habits / Psychology reading." },
            { id: "w12", start: "22:00", end: "22:30", title: "Review & Sleep", desc: "Review daily stats, plan tomorrow's 3 tasks, 8h sleep." }
        ];

        const weekendTasks = [
            { id: "we1", start: "07:00", end: "07:30", title: "Wakeup & Pray", desc: "07:00 sharp: Wudu, Fajr prayer." },
            { id: "we2", start: "07:30", end: "08:30", title: "Morning Routine", desc: "Read 'Zebuloni', breakfast, peaceful morning." },
            { id: "we3", start: "08:30", end: "10:00", title: "Heavy Workout & Shower", desc: "Extended physical training followed by shower." },
            { id: "we4", start: "10:30", end: "16:30", title: "OSG: MEGA DEEP WORK", desc: "6-Hour Execution: Sales strategy, creatives, web dev." },
            { id: "we5", start: "16:30", end: "18:00", title: "Persuasion Study", desc: "Chris Voss, Cialdini frameworks study." },
            { id: "we6", start: "18:00", end: "19:00", title: "Dinner & Prayer", desc: "Evening reset and meal." },
            { id: "we7", start: "19:00", end: "21:30", title: "Personal Time", desc: "Full disconnect, walk, relaxation." },
            { id: "we8", start: "21:30", end: "22:30", title: "Weekly Sync", desc: "Sync call with partner + plan next week." }
        ];

        // --- STATE VARIABLES ---
        let viewDate = new Date(); // Currently viewed date
        let activeTasks = [];
        let points = parseInt(localStorage.getItem("osg_points") || "0");
        let sales = parseInt(localStorage.getItem("osg_sales") || "0");
        let lastNotifiedTask = null;

        function getDateKey(d) {
            return `osg_tasks_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function initApp() {
            updateUIStats();
            loadDateTasks();
            tick();
            setInterval(tick, 1000);
        }

        function changeDate(offsetDays) {
            viewDate.setDate(viewDate.getDate() + offsetDays);
            loadDateTasks();
            tick();
        }

        function resetToToday() {
            viewDate = new Date();
            loadDateTasks();
            tick();
        }

        function loadDateTasks() {
            const todayStr = new Date().toDateString();
            const viewingStr = viewDate.toDateString();
            
            document.getElementById("btn-today").classList.toggle("active", todayStr === viewingStr);

            const isWeekend = (viewDate.getDay() === 0 || viewDate.getDay() === 6);
            let template = isWeekend ? weekendTasks : weekdayTasks;
            
            const dateKey = getDateKey(viewDate);
            const savedState = JSON.parse(localStorage.getItem(dateKey)) || {};

            activeTasks = template.map(t => ({
                ...t,
                done: savedState[t.id] ? savedState[t.id].done : false
            }));

            renderTasks();
        }

        function timeToSeconds(timeStr) {
            const [hours, mins] = timeStr.split(":").map(Number);
            return (hours * 3600) + (mins * 60);
        }

        function tick() {
            const now = new Date();
            document.getElementById("live-clock").innerText = now.toLocaleTimeString('en-GB', { hour12: false });

            const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            
            const isToday = (viewDate.toDateString() === now.toDateString());
            const isPastDate = (viewDate.toDateString() !== now.toDateString() && viewDate < now);

            document.getElementById("day-display").innerText = `${dayNames[viewDate.getDay()]}, ${viewDate.getDate()} ${monthNames[viewDate.getMonth()]} ${viewDate.getFullYear()}`;

            const currentSeconds = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
            let nextFound = false;

            activeTasks.forEach((task) => {
                const startSec = timeToSeconds(task.start);
                const endSec = timeToSeconds(task.end);
                const cardEl = document.getElementById(`task-card-${task.id}`);
                if (!cardEl) return;

                cardEl.classList.remove("active", "next", "locked", "completed");

                if (task.done) {
                    cardEl.classList.add("completed");
                    return;
                }

                if (isPastDate) {
                    // All unticked past days' tasks are tickable catch-ups
                    cardEl.classList.add("next");
                } 
                else if (!isToday && viewDate > now) {
                    // Future dates are completely locked
                    cardEl.classList.add("locked");
                } 
                else {
                    // Viewing TODAY in real-time
                    if (currentSeconds >= startSec && currentSeconds < endSec) {
                        cardEl.classList.add("active");
                        triggerAutoReminder(task);
                    } 
                    else if (currentSeconds < startSec && !nextFound) {
                        cardEl.classList.add("next");
                        nextFound = true;
                    } 
                    else if (currentSeconds < startSec) {
                        // Future task today: LOCKED
                        cardEl.classList.add("locked");
                    } 
                    else {
                        // Past missed task today: Available for catch-up
                        cardEl.classList.add("next");
                    }
                }
            });
        }

        function renderTasks() {
            const container = document.getElementById("task-list");
            container.innerHTML = "";

            activeTasks.forEach((task) => {
                const card = document.createElement("div");
                card.id = `task-card-${task.id}`;
                card.className = "task-card";

                card.innerHTML = `
                    <div class="task-info">
                        <span class="time">${task.start} – ${task.end}</span>
                        <span class="title">${task.title}</span>
                        <span class="desc">${task.desc}</span>
                    </div>
                    <div class="checkbox-wrapper" onclick="toggleTask('${task.id}')">
                        <div class="custom-checkbox"></div>
                    </div>
                `;
                container.appendChild(card);
            });
            tick();
        }

        function toggleTask(id) {
            const cardEl = document.getElementById(`task-card-${id}`);
            
            // STRICT RULE: If future/locked, user CANNOT tick it
            if (cardEl.classList.contains("locked")) return;

            const task = activeTasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                
                if (task.done) {
                    playSuccessSound();
                    points += 100;
                } else {
                    points = Math.max(0, points - 100);
                }

                logEvent(task.done ? `Completed: [${task.start}] ${task.title}` : `Unchecked: [${task.start}] ${task.title}`);
                saveData();
                renderTasks();
            }
        }

        function tickAllAvailable() {
            let tickedAny = false;
            activeTasks.forEach(task => {
                const cardEl = document.getElementById(`task-card-${task.id}`);
                if (cardEl && !cardEl.classList.contains("locked") && !task.done) {
                    task.done = true;
                    points += 100;
                    tickedAny = true;
                }
            });

            if (tickedAny) {
                playSuccessSound();
                logEvent("Executing Bulk 'Tick All' for available tasks.");
                saveData();
                renderTasks();
            }
        }

        function triggerAutoReminder(task) {
            if (lastNotifiedTask !== task.id) {
                lastNotifiedTask = task.id;
                
                // Audio Chime
                playAlertChime();

                // Banner alert
                const banner = document.getElementById("alert-banner");
                document.getElementById("alert-text").innerText = `⏰ ACTIVE BLOCK (${task.start}–${task.end}): ${task.title} — ${task.desc}`;
                banner.style.display = "block";

                // OS System Notification
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification(`⏰ OSG ALERT: ${task.title}`, {
                        body: `Time: ${task.start} - ${task.end}\n${task.desc}`,
                    });
                }
            }
        }

        function dismissAlert() {
            document.getElementById("alert-banner").style.display = "none";
        }

        function adjustSale(amount) {
            if (amount < 0 && sales <= 0) return;
            
            sales += amount;
            points += (amount * 500);
            points = Math.max(0, points);
            
            if (amount > 0) playSuccessSound();

            logEvent(amount > 0 ? "Deal Closed (+500 PTS)" : "Deal Undone (-500 PTS)");
            saveData();
        }

        function updateUIStats() {
            document.getElementById("points-display").innerText = points;
            document.getElementById("sales-display").innerText = sales;
        }

        function saveData() {
            const stateDict = {};
            activeTasks.forEach(t => stateDict[t.id] = { done: t.done });
            
            const dateKey = getDateKey(viewDate);
            localStorage.setItem(dateKey, JSON.stringify(stateDict));
            localStorage.setItem("osg_points", points.toString());
            localStorage.setItem("osg_sales", sales.toString());
            updateUIStats();
        }

        function enableNotifications() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("System alerts & desktop notifications enabled!");
                    }
                });
            }
        }
    </script>
</body>
</html>
